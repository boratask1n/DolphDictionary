<!doctype html>
<html lang="tr">
  <head>
    <script>
      (function() {
        var isViteMsg = function(arg) {
          if (!arg) return false;
          var str = typeof arg === 'string' ? arg : (arg.message || String(arg));
          return str.indexOf('[vite]') !== -1 || str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1;
        };
        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteMsg(arguments[i])) return;
          }
          origError.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteMsg(arguments[i])) return;
          }
          origWarn.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          if (isViteMsg(e.message) || isViteMsg(e.filename) || isViteMsg(e.error)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && isViteMsg(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
